name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile modules
        run: python -m py_compile *.py tests/*.py

      - name: Build scanner image
        run: docker build -f docker/sentinel-scanner.Dockerfile -t sentinel-qa-scanner:latest .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Self scan
        run: python sentinel_qa.py . --output-dir ./reports/ci-self-scan --workers 1 --max-scan-seconds 180
