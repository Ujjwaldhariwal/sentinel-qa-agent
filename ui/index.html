<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinel QA Agent</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #15171a;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(540px, calc(100vw - 32px));
      border: 1px solid #d8dde5;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 50px rgba(20, 30, 45, 0.12);
      padding: 18px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 14px;
      font-weight: 650;
    }
    h2 {
      font-size: 13px;
      margin: 18px 0 8px;
      color: #394150;
    }
    label {
      display: grid;
      gap: 7px;
      font-size: 13px;
      color: #394150;
      margin: 12px 0;
    }
    input {
      height: 38px;
      border: 1px solid #c8ced8;
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
      background: #fff;
      color: #15171a;
    }
    select {
      height: 38px;
      border: 1px solid #c8ced8;
      border-radius: 6px;
      padding: 0 10px;
      font: inherit;
      background: #fff;
      color: #15171a;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .check input {
      width: 16px;
      height: 16px;
    }
    button {
      height: 38px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: #1d4ed8;
      color: white;
      font-weight: 650;
      cursor: pointer;
    }
    button.secondary {
      background: #e8edf5;
      color: #172033;
    }
    pre {
      min-height: 86px;
      max-height: 220px;
      overflow: auto;
      border-radius: 6px;
      background: #101418;
      color: #d8f3dc;
      padding: 12px;
      white-space: pre-wrap;
      font-size: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }
    li {
      border: 1px solid #d8dde5;
      border-radius: 6px;
      padding: 9px;
      font-size: 12px;
      display: grid;
      gap: 3px;
    }
    .muted {
      color: #647083;
    }
    @media (prefers-color-scheme: dark) {
      :root { background: #101318; color: #f3f5f7; }
      main { background: #171b22; border-color: #303846; }
      label { color: #c5cbd5; }
      input { background: #101318; color: #f3f5f7; border-color: #404858; }
      select { background: #101318; color: #f3f5f7; border-color: #404858; }
      h2 { color: #c5cbd5; }
      button.secondary { background: #2a3240; color: #f3f5f7; }
      li { border-color: #303846; }
      .muted { color: #9aa4b4; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Sentinel QA Agent</h1>
    <label>
      Project folder
      <input id="root" placeholder="/Users/you/code">
    </label>
    <label>
      Output folder
      <input id="output" placeholder="./latest-report">
    </label>
    <label>
      Token
      <input id="token" placeholder="optional service token">
    </label>
    <label>
      Web app URL
      <input id="webUrl" placeholder="http://localhost:3000">
    </label>
    <label>
      Routes
      <input id="webRoutes" placeholder="/,/login,/dashboard">
    </label>
    <label>
      Web viewport
      <select id="webViewport">
        <option value="desktop">Desktop</option>
        <option value="mobile">Mobile</option>
      </select>
    </label>
    <div class="row">
      <label class="check">
        <input id="ai" type="checkbox" checked>
        AI review
      </label>
      <label class="check">
        <input id="discoverRoutes" type="checkbox">
        Discover routes
      </label>
      <div>
        <button class="secondary" id="refresh">History</button>
        <button id="scan">Run QA</button>
      </div>
    </div>
    <pre id="status">Idle</pre>
    <h2>Recent Runs</h2>
    <ul id="runs"></ul>
  </main>
  <script>
    const root = document.querySelector("#root");
    const output = document.querySelector("#output");
    const token = document.querySelector("#token");
    const webUrl = document.querySelector("#webUrl");
    const webRoutes = document.querySelector("#webRoutes");
    const webViewport = document.querySelector("#webViewport");
    const ai = document.querySelector("#ai");
    const discoverRoutes = document.querySelector("#discoverRoutes");
    const scan = document.querySelector("#scan");
    const refresh = document.querySelector("#refresh");
    const status = document.querySelector("#status");
    const runs = document.querySelector("#runs");

    token.value = localStorage.getItem("sentinelToken") || "";

    function routeList() {
      return webRoutes.value
        .split(",")
        .map(route => route.trim())
        .filter(Boolean);
    }

    async function loadRuns() {
      const response = await fetch("/runs?limit=8", { headers: authHeaders() });
      const data = await response.json();
      runs.textContent = "";
      for (const run of data.runs || []) {
        const item = document.createElement("li");
        const date = new Date(run.finished_at * 1000).toLocaleString();
        const title = document.createElement("strong");
        title.textContent = `#${run.id} ${run.status}`;
        const summary = document.createElement("span");
        summary.textContent = `${run.finding_count} finding(s), ${run.project_count} project(s)`;
        const timestamp = document.createElement("span");
        timestamp.className = "muted";
        timestamp.textContent = date;
        const report = document.createElement("span");
        report.className = "muted";
        report.textContent = run.report_md;
        item.append(title, summary, timestamp, report);
        runs.appendChild(item);
      }
    }

    function authHeaders() {
      if (!token.value) return {};
      localStorage.setItem("sentinelToken", token.value);
      return { "Authorization": `Bearer ${token.value}` };
    }

    scan.addEventListener("click", async () => {
      status.textContent = "Scanning...";
      scan.disabled = true;
      try {
        const webOnly = !root.value && webUrl.value;
        const response = await fetch(webOnly ? "/web-qa" : "/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...authHeaders() },
          body: JSON.stringify(webOnly
            ? {
                url: webUrl.value,
                output_dir: output.value || undefined,
                viewport: webViewport.value,
                routes: routeList(),
                root: root.value || undefined,
                discover_routes: discoverRoutes.checked
              }
            : {
                root: root.value,
                output_dir: output.value || undefined,
                ai_review: ai.checked,
                web_url: webUrl.value || undefined,
                web_routes: routeList(),
                web_discover_routes: discoverRoutes.checked,
                web_viewport: webViewport.value
              })
        });
        status.textContent = JSON.stringify(await response.json(), null, 2);
        await loadRuns();
      } catch (error) {
        status.textContent = String(error);
      } finally {
        scan.disabled = false;
      }
    });

    refresh.addEventListener("click", loadRuns);
    loadRuns().catch(() => {});
  </script>
</body>
</html>
